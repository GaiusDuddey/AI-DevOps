version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-devops-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://hemistichal-adrienne-militantly.ngrok-free.dev
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./sandbox:/sandbox